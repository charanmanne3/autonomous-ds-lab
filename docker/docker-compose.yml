version: "3.9"

services:
  api:
    image: python:3.11-slim
    container_name: autonomous-ds-api
    working_dir: /app
    volumes:
      - ../:/app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      - mlflow

  mlflow:
    image: python:3.11-slim
    container_name: autonomous-ds-mlflow
    working_dir: /mlflow
    volumes:
      - ../mlflow:/mlflow
    command: >
      sh -c "pip install --no-cache-dir mlflow psycopg2-binary &&
             mlflow server
             --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
             --default-artifact-root /mlflow/artifacts
             --host 0.0.0.0
             --port 5000"
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: autonomous-ds-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

